openapi: 3.1.0
info:
  title: Xquik API
  version: "1.0"
  description: >-
    Search public X posts. Xquik is an independent third-party service. Not
    affiliated with X Corp. "Twitter" and "X" are trademarks of X Corp.
servers:
  - url: https://xquik.com
security:
  - xApiKey: []
paths:
  /api/v1/x/tweets/search:
    get:
      summary: Search posts by query, post ID, X status URL, or account date window
      operationId: searchTweets
      parameters:
        - name: q
          in: query
          required: true
          description: Search query
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of posts to return across paginated results
          schema:
            type: integer
            default: 20
            maximum: 200
        - name: cursor
          in: query
          required: false
          description: Pagination cursor from the previous response
          schema:
            type: string
        - name: queryType
          in: query
          required: false
          description: Sort results chronologically or by engagement
          schema:
            type: string
            enum:
              - Latest
              - Top
            default: Latest
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: object
                required:
                  - tweets
                  - has_next_page
                  - next_cursor
                properties:
                  tweets:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - text
                      properties:
                        id:
                          type: string
                        text:
                          type: string
                        author:
                          type: object
                          properties:
                            username:
                              type: string
                  has_next_page:
                    type: boolean
                  next_cursor:
                    type: string
components:
  securitySchemes:
    xApiKey:
      type: apiKey
      in: header
      name: x-api-key
